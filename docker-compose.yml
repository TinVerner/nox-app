services:
  nox-db:
    image: postgres:16-alpine
    container_name: nox-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - nox_pg_data:/var/lib/postgresql/data

  nox-api:
    image: nox-api
    container_name: nox-api
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@nox-db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      - nox-db

  nox-proxy:
    image: nginx:1.27-alpine
    container_name: nox-proxy
    ports:
      - "8081:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/html:/usr/share/nginx/html:ro
    depends_on:
      - nox-api

volumes:
  nox_pg_data:
    external: true
    name: nox-app_nox_pg_data
