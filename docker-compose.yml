services:
  web:
    container_name: nox-web
    ports:
      - "5173:5173"
    profiles:
      - later

  api:
    container_name: nox-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    profiles:
      - later

  db:
    image: postgres:16-alpine
    container_name: nox-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nox}
    volumes:
      - nox_pg_data:/var/lib/postgresql/data

volumes:
  nox_pg_data: